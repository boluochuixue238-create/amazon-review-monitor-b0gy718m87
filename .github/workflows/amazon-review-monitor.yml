name: Amazon Review Monitor

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amazon-review-monitor-b0gy718m87
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Amazon review count
        env:
          ASIN: B0GY718M87
          AMAZON_URL: https://www.amazon.com/dp/B0GY718M87?th=1
          ALERT_TO: 3326690363@qq.com,1336155698@qq.com,784541190@qq.com
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python amazon_review_monitor.py

      - name: Commit monitor state changes
        run: |
          if git diff --quiet amazon-review-monitor-state.json; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amazon-review-monitor-state.json
          git commit -m "Update Amazon review monitor state"
          git push
